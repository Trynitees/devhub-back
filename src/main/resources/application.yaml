spring:
  application:
    name: devhub
  jackson:
    property-naming-strategy: SNAKE_CASE
  datasource:
    url: jdbc:postgresql://localhost:5432/devhub
    username: ${DB_USERNAME:devhub}
    password: ${DB_PASSWORD:devhub}
  jpa:
    hibernate:
      ddl-auto: update
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

server:
  port: 8000

app:
  upload-dir: uploads