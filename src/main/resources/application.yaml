spring:
  application:
    name: devhub
  jackson:
    property-naming-strategy: SNAKE_CASE
  datasource:
    url: jdbc:postgresql://localhost:5432/devhub
    username: ${DB_USERNAME:devhub}
    password: ${DB_PASSWORD:devhub}
  jpa:
    hibernate:
      ddl-auto: update
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

server:
  port: 8000

app:
  upload-dir: uploads
  parser:
    sources:
      - name: Habr
        url: https://habr.com/ru/rss/articles/?fl=ru
      - name: Tproger
        url: https://tproger.ru/feed
      - name: 3DNews
        url: https://3dnews.ru/software-news/rss
      - name: IT-Новости
        url: https://it-novosti.ru/rss/latest-posts
      - name: TechCrunch
        url: https://techcrunch.com/feed/
      - name: Ars Technica
        url: https://feeds.arstechnica.com/arstechnica/index
      - name: BleepingComputer
        url: https://www.bleepingcomputer.com/feed/
      - name: Slashdot
        url: http://rss.slashdot.org/Slashdot/slashdot
      - name: GitHub Blog
        url: https://github.blog/feed/
      - name: Stack Overflow
        url: https://stackoverflow.blog/feed/
      - name: Cloudflare
        url: https://blog.cloudflare.com/rss/
      - name: OpenAI
        url: https://openai.com/news/rss.xml